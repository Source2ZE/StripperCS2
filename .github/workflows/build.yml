name: CI

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    env:
      HL2SDKCS2: ${{ github.workspace }}/hl2sdk-cs2
      MMSOURCE_DEV: ${{ github.workspace }}/mmsource-2.0
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: SteamRT3
            container: ghcr.io/source2ze/build-containers:steamrt3
          - os: ubuntu-latest
            name: SteamRT4
            container: ghcr.io/source2ze/build-containers:steamrt4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: StripperCS2
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: 7ec0f16948ab3a0910a98b4ac10e1c0e360d5339
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Install Premake5
        if: matrix.os == 'windows-latest'
        uses: abel0b/setup-premake@v2.4
        with:
          version: '5.0.0-beta8'

      - name: Setup MSBuild
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v3

      - name: Windows Build
        if: matrix.os == 'windows-latest'
        working-directory: StripperCS2
        run: |
          premake5 vs2026
          msbuild build/StripperCS2.slnx /m /p:Configuration=Release /p:Platform=x64
          premake5 package

      - name: Linux Build
        if: matrix.os == 'ubuntu-latest'
        working-directory: StripperCS2
        run: |
          premake5 gmake
          make -C build config=release_x64 -j$(nproc)
          premake5 package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: StripperCS2/build/package/StripperCS2

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          if [ -d "./SteamRT3/" ]; then
            cd ./SteamRT3/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt3.tar.gz *
            cd -
          fi
          if [ -d "./SteamRT4/" ]; then
            cd ./SteamRT4/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt4.tar.gz *
            cd -
          fi
          if [ -d "./Windows/" ]; then
            cd ./Windows/
            zip -r ../${{ github.event.repository.name }}-${version}-windows.zip *
            cd -
          fi

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.event.repository.name }}-*
          tag: ${{ github.ref }}
          file_glob: true
